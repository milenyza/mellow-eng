spring:
  application:
    name: mellow-backend
  datasource:
    url: ${MELLOW_DB_URL}
    username: ${MELLOW_DB_USER}
    password: ${MELLOW_DB_PASSWORD}
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    default-schema: public
    create-schemas: false
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: mellow
  jackson:
    factory:
      constraints:
        read:
          max-nesting-depth: 64
    read:
      strict-duplicate-detection: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true

server:
  address: ${MELLOW_HTTP_ADDRESS:127.0.0.1}
  port: ${MELLOW_HTTP_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: false

logging:
  level:
    root: ${MELLOW_LOG_LEVEL:INFO}
    org.springframework.web.servlet.mvc.method.annotation: INFO
    org.springframework.web.method.HandlerMethod: INFO
    org.hibernate.orm.core: INFO
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
